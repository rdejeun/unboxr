# Publishes unboxr to PyPI when a GitHub release is published.
#
# The release tag must be the bare version, "x.y.z" (no "v" prefix), and must
# equal `__version__` in `unboxr/__init__.py`. A version uploaded to PyPI can
# never be uploaded again, so any mismatch stops the workflow before upload.
#
# Authentication is PyPI Trusted Publishing: no token is stored anywhere. The
# PyPI project must declare this repository, this workflow file and the
# `pypi` environment as a trusted publisher.
#
# Every uploaded file carries a PEP 740 provenance attestation, signed through
# Sigstore with this workflow's identity: anyone can check that a file on PyPI
# was built by this workflow, from this repository, at a given commit.
name: Publish

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv run --no-project --python ${{ matrix.python }} --with pytest python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv build
      - name: Check the release tag against the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' is not of the form x.y.z"
            exit 1
          fi
          if ! [ -f "dist/unboxr-$TAG.tar.gz" ] || ! [ -f "dist/unboxr-$TAG-py3-none-any.whl" ]; then
            echo "::error::Release tag '$TAG' does not match __version__ in unboxr/__init__.py"
            ls dist
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/unboxr/${{ github.event.release.tag_name }}/
    # Only this job can request the OIDC token, which both PyPI and Sigstore
    # trust; the jobs that run the tests and the build never hold it.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Not `uv publish`: it uploads files but does not generate attestations.
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          attestations: true
